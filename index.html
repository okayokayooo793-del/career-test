<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 职业人格测试</title>
<style>
  :root {
    --bg: #06060f;
    --surface: rgba(255,255,255,0.03);
    --border: rgba(255,255,255,0.06);
    --text: #e2e2ea;
    --text-secondary: #8b8b9e;
    --accent-1: #00d4ff;
    --accent-2: #7b5cff;
    --accent-3: #ff4785;
    --accent-4: #00e5a0;
    --accent-5: #ffb347;
    --radius: 18px;
    --radius-sm: 12px;
    --transition: 0.35s cubic-bezier(0.25, 0.8, 0.25, 1.2);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* Background ambient */
  .bg-ambient {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .bg-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.12;
    animation: orbFloat 20s ease-in-out infinite;
  }
  .bg-orb:nth-child(1) { width: 600px; height: 600px; background: var(--accent-2); top: -200px; left: -200px; animation-delay: 0s; }
  .bg-orb:nth-child(2) { width: 500px; height: 500px; background: var(--accent-1); bottom: -200px; right: -150px; animation-delay: -7s; }
  .bg-orb:nth-child(3) { width: 400px; height: 400px; background: var(--accent-3); top: 40%; left: 50%; animation-delay: -14s; }

  @keyframes orbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    25% { transform: translate(60px, -60px) scale(1.15); }
    50% { transform: translate(-30px, 40px) scale(0.9); }
    75% { transform: translate(-50px, -30px) scale(1.1); }
  }

  /* Grid overlay */
  .bg-grid {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 70%);
  }

  /* Particles */
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* App container */
  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 16px;
  }

  /* Screen management */
  .screen { display: none; }
  .screen.active { display: block; }

  /* Cards */
  .card {
    background: var(--surface);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 36px 32px;
    animation: cardIn 0.5s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Welcome screen */
  .welcome-icon {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 12px 40px rgba(0,212,255,0.2);
  }

  .title {
    font-size: 2rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #e8e8f0 0%, #c0c0d8 50%, #a8b8e0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    text-align: center;
    color: var(--text-secondary);
    font-size: 0.9rem;
    line-height: 1.7;
    margin-bottom: 28px;
  }

  .feat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .feat-item {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: var(--radius-sm);
    padding: 14px;
    text-align: center;
    transition: var(--transition);
  }
  .feat-item .fi-icon { font-size: 1.4rem; margin-bottom: 4px; }
  .feat-item .fi-label { font-size: 0.78rem; color: var(--text-secondary); }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 24px;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.3px;
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff;
    box-shadow: 0 8px 30px rgba(0,180,255,0.25);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(0,180,255,0.35); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    background: rgba(255,255,255,0.05);
    color: #ccc;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .btn-sm { padding: 10px 20px; font-size: 0.85rem; }

  /* Quiz screen */
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-qnum {
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--accent-1);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .quiz-dim {
    font-size: 0.72rem;
    color: var(--text-secondary);
    background: rgba(255,255,255,0.04);
    padding: 4px 10px;
    border-radius: 20px;
  }

  .progress-wrap { margin-bottom: 24px; }
  .progress-track {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2), var(--accent-3));
    background-size: 200% 100%;
    animation: shimmer 2s ease infinite;
    transition: width 0.5s ease;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .progress-text {
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .q-text {
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.65;
    margin-bottom: 24px;
    min-height: 60px;
  }

  .scale-group {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .scale-btn {
    flex: 1;
    padding: 14px 6px;
    background: rgba(255,255,255,0.025);
    border: 2px solid rgba(255,255,255,0.06);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-secondary);
    transition: var(--transition);
    font-family: inherit;
    line-height: 1.3;
    min-height: 60px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scale-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.14); }
  .scale-btn.selected {
    background: rgba(0,212,255,0.1);
    border-color: var(--accent-1);
    color: #fff;
    box-shadow: 0 0 24px rgba(0,212,255,0.1);
  }

  .nav-row {
    display: flex;
    gap: 10px;
  }
  .nav-row .btn { flex: 1; }

  /* Analyzing screen */
  .analyze-content {
    text-align: center;
    padding: 40px 0;
  }
  .analyze-ring {
    width: 80px; height: 80px;
    margin: 0 auto 24px;
    position: relative;
  }
  .analyze-ring svg { animation: spin 2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .analyze-ring .ar-icon {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
  }
  .analyze-text {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .analyze-dots { display: inline-block; width: 24px; text-align: left; }

  /* Result screen */
  .result-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .result-type-tag {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 2px;
    color: var(--accent-1);
    background: rgba(0,212,255,0.08);
    padding: 5px 14px;
    border-radius: 20px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .result-title {
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .result-subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.6;
  }

  /* Radar */
  .radar-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 28px;
  }
  .radar-wrap svg { max-width: 280px; width: 100%; }

  /* Dimension details */
  .dim-section { margin-bottom: 24px; }
  .dim-section h3 {
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .dim-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .dim-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .dim-info { flex: 1; min-width: 0; }
  .dim-name { font-size: 0.88rem; font-weight: 500; margin-bottom: 2px; }
  .dim-desc { font-size: 0.72rem; color: var(--text-secondary); }
  .dim-score {
    font-size: 1.2rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .dim-bar-track {
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-top: 6px;
    overflow: hidden;
  }
  .dim-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1.2s ease;
  }

  /* Career matches */
  .careers-title {
    font-size: 0.85rem;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }
  .career-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: var(--radius-sm);
    padding: 16px;
    margin-bottom: 8px;
    transition: var(--transition);
  }
  .career-rank {
    width: 28px; height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .career-rank.top { background: rgba(0,229,160,0.12); color: var(--accent-4); }
  .career-rank.mid { background: rgba(255,179,71,0.12); color: var(--accent-5); }
  .career-rank.low { background: rgba(255,255,255,0.04); color: var(--text-secondary); }
  .career-info { flex: 1; min-width: 0; }
  .career-name { font-size: 0.92rem; font-weight: 600; }
  .career-roles { font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }
  .career-match {
    font-size: 1.1rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .career-match.high { color: var(--accent-4); }
  .career-match.good { color: var(--accent-5); }
  .career-match.ok { color: var(--text-secondary); }

  .restart-btn {
    margin-top: 24px;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .card { padding: 24px 18px; border-radius: var(--radius-sm); }
    .title { font-size: 1.5rem; }
    .q-text { font-size: 1rem; }
    .scale-group { gap: 5px; }
    .scale-btn { padding: 12px 3px; font-size: 0.7rem; min-height: 52px; }
    .feat-grid { gap: 6px; }
    .feat-item { padding: 10px 6px; }
    .feat-item .fi-label { font-size: 0.7rem; }
    .analyze-content { padding: 28px 0; }
    .result-title { font-size: 1.3rem; }
  }

  @media (min-width: 768px) {
    .scale-btn { padding: 16px 10px; font-size: 0.82rem; }
  }
</style>
</head>
<body>

<!-- Ambient background -->
<div class="bg-ambient">

<script>
// ─── Particles ──────────────────────────────
(() => {
  const c = document.getElementById('particles');
  const ctx = c.getContext('2d');
  let w, h, pts = [];
  const N = 60;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < N; i++) {
    pts.push({
      x: Math.random() * w, y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.3,
      vy: (Math.random() - 0.5) * 0.3,
      r: Math.random() * 1.5 + 0.5,
      o: Math.random() * 0.5 + 0.2,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${p.o})`;
      ctx.fill();
    }
    // Lines between nearby particles
    for (let i = 0; i < N; i++) {
      for (let j = i + 1; j < N; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < 120) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.strokeStyle = `rgba(255,255,255,${0.04 * (1 - d / 120)})`;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ─── Data ───────────────────────────────────
const dimensions = [

];

  // 分析力 (8)

// Shuffle questions
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const shuffledQuestions = shuffle(questions);

const scaleLabels = ['完全不符合', '不太符合', '一般', '比较符合', '非常符合'];

// ─── State ──────────────────────────────────
let currentQ = 0;
let answers = new Array(shuffledQuestions.length).fill(0);
const totalQ = shuffledQuestions.length;

// ─── Screen switching ─────────────────────
let dotsTimer = null;
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  el.classList.add('active');
  const card = el.querySelector('.card');
  if (card) { card.style.animation = 'none'; card.offsetHeight; card.style.animation = ''; }

  // Animate analyzing dots
  if (dotsTimer) clearInterval(dotsTimer);
  if (id === 'screen-analyzing') {
    const dots = el.querySelector('.analyze-dots');
    if (dots) {
      let n = 0;
      dotsTimer = setInterval(() => { n = (n + 1) % 4; dots.textContent = '.'.repeat(n); }, 400);
    }
  }
}

// ─── Quiz ──────────────────────────────────
function startQuiz() {
  currentQ = 0;
  answers = new Array(shuffledQuestions.length).fill(0);
  showScreen('screen-quiz');
  renderQ();
}

function renderQ() {
  const q = shuffledQuestions[currentQ];
  document.getElementById('quiz-qnum').textContent = `第 ${currentQ + 1} 题`;
  const dim = dimensions.find(d => d.key === q.dim);
  document.getElementById('quiz-dim').textContent = dim.icon + ' ' + dim.name;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('progress-text').textContent = `${currentQ + 1} / ${totalQ}`;
  document.getElementById('progress-fill').style.width = `${((currentQ + 1) / totalQ) * 100}%`;

  const group = document.getElementById('scale-group');
  group.innerHTML = '';
  scaleLabels.forEach((label, i) => {
    const val = i + 1;
    const btn = document.createElement('button');
    btn.className = 'scale-btn';
    if (answers[currentQ] === val) btn.classList.add('selected');
    btn.textContent = label;
    btn.onclick = () => {
      answers[currentQ] = val;
      group.querySelectorAll('.scale-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      document.getElementById('btn-next').disabled = false;
    };
    group.appendChild(btn);
  });

  document.getElementById('btn-prev').style.visibility = currentQ === 0 ? 'hidden' : 'visible';
  const nextBtn = document.getElementById('btn-next');
  nextBtn.disabled = answers[currentQ] === 0;
  nextBtn.textContent = currentQ === totalQ - 1 ? '查看结果' : '下一题';
}

function nextQ() {
  if (answers[currentQ] === 0) return;
  if (currentQ === totalQ - 1) {
    showScreen('screen-analyzing');
    setTimeout(showResult, 2200);
  } else {
    currentQ++;
    renderQ();
  }
}

function prevQ() {
  if (currentQ > 0) { currentQ--; renderQ(); }
}

// ─── Results ───────────────────────────────
function showResult() {
  // Calculate scores
  const raw = {};
  const counts = {};
  dimensions.forEach(d => { raw[d.key] = 0; counts[d.key] = 0; });

  shuffledQuestions.forEach((q, i) => {
    if (answers[i] > 0) {
      raw[q.dim] += answers[i];
      counts[q.dim]++;
    }
  });

  // Normalize to 1-5
  const userScores = {};
  dimensions.forEach(d => {
    userScores[d.key] = counts[d.key] > 0 ? +(raw[d.key] / counts[d.key]).toFixed(1) : 3.0;
  });

  // Determine type
  const sorted = [...dimensions].sort((a, b) => userScores[b.key] - userScores[a.key]);
  const top2 = sorted.slice(0, 2).map(d => d.name).join('型 + ');
  const typeName = top2 + '型';

  // Generate type description
  const highest = sorted[0];
  const lowest = sorted[4];
  let typeDesc = `你是一位典型的"${sorted[0].name}驱动"型人才，${sorted[0].desc.split('与')[0]}。`;
  if (userScores[highest.key] >= 4) {
    typeDesc += `你的${highest.name}表现非常突出，这是你最核心的职业竞争力。`;
  }
  typeDesc += `同时，你的${lowest.name}相对较低，这定义了你的工作偏好——${lowest.desc.split('与')[0]}对你来说可能不是自然的舒适区。`;

  // Career matching
  function euclidean(a, b) {
    let sum = 0;
    for (const k in a) sum += (a[k] - b[k]) ** 2;
    return Math.sqrt(sum);
  }
  const maxDist = Math.sqrt(5 * 4 * 4); // ≈ 8.944
  const matches = careers.map(c => {
    const dist = euclidean(userScores, c.scores);
    const pct = Math.round((1 - dist / maxDist) * 100);
    return { ...c, match: Math.max(0, Math.min(100, pct)) };
  }).sort((a, b) => b.match - a.match);

  const top5 = matches.slice(0, 5);

  // Build result HTML

  card.innerHTML = `
    <div class="result-header">
      <div class="result-type-tag">YOUR CAREER ARCHETYPE</div>
      <div class="result-title">${typeName}</div>
      <div class="result-subtitle">${typeDesc}</div>
    </div>

    <div class="radar-wrap">
      <svg viewBox="0 0 300 300" id="radar-svg">
        <!-- Grid -->
        ${[1,2,3,4,5].map(lvl => {
          const r = 25 + lvl * 23;
          const pts = [270,342,54,126,198].map(a => {
            const rad = a * Math.PI / 180;
            return `${130 + r * Math.cos(rad)},${150 + r * Math.sin(rad)}`;
          }).join(' ');
          return `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,${lvl===5?0.12:0.04})" stroke-width="1"/>`;
        }).join('')}
        <!-- Axes -->
        ${[270,342,54,126,198].map(a => {
          const rad = a * Math.PI / 180;
          return `<line x1="130" y1="150" x2="${130+140*Math.cos(rad)}" y2="${150+140*Math.sin(rad)}" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>`;
        }).join('')}
        <!-- Labels -->
        ${dimensions.map((d, i) => {
          const a = [270,342,54,126,198][i];
          const rad = a * Math.PI / 180;
          const lx = 130 + 158 * Math.cos(rad);
          const ly = 150 + 158 * Math.sin(rad);
          const score = userScores[d.key];
          return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" fill="${d.color}" font-size="11" font-weight="600">${d.icon} ${score}</text>`;
        }).join('')}
        <!-- User polygon -->
        <polygon points="${dimensions.map((d, i) => {
          const a = [90,162,234,306,18][i];
          const r = 25 + userScores[d.key] * 23;
          const rad = (a - 90) * Math.PI / 180;
          return `${(130 + r * Math.cos(rad)).toFixed(1)},${(150 + r * Math.sin(rad)).toFixed(1)}`;
        }).join(' ')}" fill="rgba(0,212,255,0.15)" stroke="var(--accent-1)" stroke-width="2" stroke-linejoin="round"/>
        <!-- Dots -->
        ${dimensions.map((d, i) => {
          const a = [90,162,234,306,18][i];
          const r = 25 + userScores[d.key] * 23;
          const rad = (a - 90) * Math.PI / 180;
          return `<circle cx="${(130 + r * Math.cos(rad)).toFixed(1)}" cy="${(150 + r * Math.sin(rad)).toFixed(1)}" r="4" fill="${d.color}" stroke="#fff" stroke-width="1.5"/>`;
        }).join('')}
        <circle cx="130" cy="150" r="3" fill="rgba(255,255,255,0.3)"/>
      </svg>
    </div>

    <div class="dim-section">
      <h3>五维分析</h3>
      ${dimensions.map(d => `
        <div class="dim-row">
          <div class="dim-icon" style="background:${d.color}22;color:${d.color}">${d.icon}</div>
          <div class="dim-info">
            <div class="dim-name">${d.name}</div>
            <div class="dim-desc">${d.desc}</div>
            <div class="dim-bar-track"><div class="dim-bar-fill" style="width:${(userScores[d.key]/5)*100}%;background:${d.color};transition-delay:${dimensions.indexOf(d)*0.1}s"></div></div>
          </div>
          <div class="dim-score" style="color:${d.color}">${userScores[d.key]}<span style="font-size:0.6rem;font-weight:400">/5</span></div>
        </div>
      `).join('')}
    </div>

    <div class="careers-title">🏆 职业匹配 TOP 5</div>
    ${top5.map((c, i) => {
      const rankClass = i < 2 ? 'top' : (i < 4 ? 'mid' : 'low');
      const matchClass = c.match >= 90 ? 'high' : (c.match >= 75 ? 'good' : 'ok');
      return `
        <div class="career-card">
          <div class="career-rank ${rankClass}">${i + 1}</div>
          <div class="career-info">
            <div class="career-name">${c.name}</div>
            <div class="career-roles">${c.roles}</div>
          </div>
          <div class="career-match ${matchClass}">${c.match}%</div>
        </div>
      `;
    }).join('')}

    <div style="margin-top:20px;padding:16px;background:rgba(255,255,255,0.015);border-radius:12px;border:1px solid rgba(255,255,255,0.04);">
      <p style="font-size:0.78rem;color:var(--text-secondary);line-height:1.7;text-align:center;">
        💡 <strong>提示：</strong>以上结果基于你的答题数据分析得出。职业选择是多维度的，建议结合个人兴趣、价值观和发展规划综合考量。测试结果仅供参考。
      </p>
    </div>

    <button class="btn btn-primary restart-btn" onclick="restart()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
      重新测试
    </button>
  `;

  showScreen('screen-result');

  // Animate bars
  setTimeout(() => {
    card.querySelectorAll('.dim-bar-fill').forEach(el => {
      el.style.width = el.style.width;
    });
  }, 200);
}

function restart() {
  showScreen('screen-welcome');
}
